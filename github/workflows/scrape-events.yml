name: Weekly event scrape

on:
  schedule:
    - cron: "0 10 * * 1"   # every Monday, 10:00 UTC (5am New York)
  workflow_dispatch:         # adds a "Run workflow" button for manual runs
    inputs:
      source_limit:
        description: "Only scrape the first N sources (leave empty for all)"
        required: false
        default: ""

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Scrape and save events
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SOURCE_LIMIT: ${{ github.event.inputs.source_limit }}
        run: python scripts/scrape_events.py
